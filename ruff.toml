# Формат і лінт для всього Python-коду репозиторію.
# Запуск: just fmt / just lint

line-length = 100
target-version = "py313"
# docs/ на будь-якому рівні – незмінні матеріали викладача разом з його прикладами коду,
# їх не форматуємо й не лінтимо. out/ – згенеровані графіки.
extend-exclude = [".venv", "docs", "out", "*.md"]
# Модулі лаб лежать пласко в src/ і імпортуються за іменем. Без цього ruff вважає
# їх сторонніми пакетами й вимагає сортувати разом із numpy.
src = ["labs/*/project/src"]

[lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # сортування імпортів
    "UP",       # застарілі конструкції
    "B",        # bugbear
    "SIM",      # спрощення
    "C4",       # comprehensions
    "NPY",      # numpy-специфічні
    "RUF",
]
ignore = [
    # Код і коментарі українською: ці правила шукають гомогліфи в ASCII
    # й дають хибне спрацювання на кожній кириличній літері.
    "RUF001", "RUF002", "RUF003",
    # Однолітерні імена - математичні позначення з методички.
    "E741",
]

[format]
quote-style = "double"
docstring-code-format = true
